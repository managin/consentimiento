<script>
(function(){

 const consentBox = document.getElementById('consentBox');
 let consentChecked = false;

 consentBox.addEventListener('click', () => {
     consentChecked = !consentChecked;
     consentBox.classList.toggle('checked', consentChecked);
 });

 const form = document.getElementById('consentimientoForm');
 const submitBtn = document.getElementById('submitBtn');
 const messageBox = document.getElementById('message');

 const flaskUrl = 'https://imuser.ddns.net/submit-form';

 function showMessage(text, type='info') {

     messageBox.style.display='block';

     if(type === 'error'){
         messageBox.style.background = '#fee2e2';
     } else if(type === 'success'){
         messageBox.style.background = '#dcfce7';
     } else {
         messageBox.style.background = '#e0f2fe';
     }

     messageBox.textContent = text;
 }

 form.addEventListener('submit', async (e) => {

     e.preventDefault();

     if(!consentChecked){
         showMessage(
             'Por favor marque la casilla de consentimiento antes de enviar.',
             'error'
         );
         return;
     }

     const nombre = document.getElementById('nombre').value.trim();
     const dni = document.getElementById('dni').value.trim();
     const lugar = document.getElementById('lugar').value.trim();
     const fecha = document.getElementById('fecha').value;
     const hora = document.getElementById('hora').value;

     if(!nombre || !dni || !lugar || !fecha || !hora){

         showMessage(
             'Complete todos los campos obligatorios antes de enviar.',
             'error'
         );

         return;
     }

     const inputs = form.querySelectorAll('input');

     inputs.forEach(i => {
         i.setAttribute('value', i.value || '');
         i.setAttribute('disabled', 'true');
     });

     if(consentChecked){
         consentBox.classList.add('checked');
     }

     submitBtn.disabled = true;
     submitBtn.style.opacity = '0.6';

     showMessage('Enviando formulario...');

     const formHtml =
         document.getElementById('form-container').outerHTML;

     const pdf_filename =
         `Consentimiento_DNI_${
             dni.replace(/[^a-zA-Z0-9]/g,'').trim()
             || 'no_dni'
         }.pdf`;

     const payload = {
         nombre,
         dni,
         lugar,
         fecha,
         hora,
         consentimiento: consentChecked ? 'Sí' : 'No',
         form_html: formHtml,
         pdf_filename
     };

     try {

         const resp = await fetch(flaskUrl, {

             method: 'POST',

             mode: 'cors',

             headers: {
                 'Content-Type': 'application/json'
             },

             body: JSON.stringify(payload)

         });

         let result = '';

         try{
             result = await resp.text();
         }catch(e){
             result = 'sin respuesta';
         }

         if(resp.ok){

             showMessage(
                 'Formulario enviado correctamente.',
                 'success'
             );

         } else {

             showMessage(
                 `Error ${resp.status}: ${result}`,
                 'error'
             );

         }

     } catch(err){

         console.error(err);

         showMessage(
             'Error de conexión: ' + err.message,
             'error'
         );

     } finally {

         inputs.forEach(i=>{
             i.removeAttribute('disabled');
         });

         submitBtn.disabled = false;
         submitBtn.style.opacity = '1';

     }

 });

})();
</script>
